<script>
    window.addEventListener('message', (e) => {
        if (!e.data || !e.data.video) return;
        let video = document.querySelector('video');
        if (!video) {
            video = document.createElement('video');
            video.className = 'td-video-bg';
            video.muted = true;
            video.autoplay = true;
            video.loop = true;
            video.playsInline = true;
            video.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32;filter:grayscale(.7) contrast(1.25) brightness(.62);z-index:0;pointer-events:none;';
            document.body.prepend(video);
            document.querySelectorAll('body > :not(.td-video-bg)').forEach((el) => {
                if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
                el.style.zIndex = el.style.zIndex || '1';
            });
        }
        video.src = e.data.video;
        video.play().catch(() => {});
    });
</script>
